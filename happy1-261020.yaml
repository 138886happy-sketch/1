mixed-port: 7890
allow-lan: false
mode: rule

proxy-providers:
  my_airport:
    type: http
    url: "https://xn--9kqs1lo79d.cc/api/v1/chuixue?token=b6b89f2b1c885d987f220602479ec667"
    interval: 86400
    lazy: true

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    use:
      - my_airport
    proxies:
      - DIRECT

rules:
  # --- 自定义域名规则 ---
  - DOMAIN-SUFFIX,whatsapp.com,🚀 节点选择
  - DOMAIN-KEYWORD,openai,🚀 节点选择
  
  # --- 自定义 IP 规则 ---
  - IP-CIDR,10.0.0.0/8,DIRECT
  
  # --- 默认兜底规则 ---
  - MATCH, 🚀 节点选择
